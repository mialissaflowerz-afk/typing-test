<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livex Solutions Typing Test</title>
    <!-- Load Tailwind CSS for styling -->
    <style>
        /* Custom styles for the typing test */
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* Light slate background */
            color: #334155;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .typing-area {
            font-family: 'Roboto Mono', monospace;
            font-size: 1.5rem;
            line-height: 1.6;
            letter-spacing: 0.05em;
            position: relative;
            user-select: none; /* Prevent selecting the text directly */
            white-space: pre-wrap; /* preserve spaces so they don't collapse between char spans */
        }

        /* Styles for individual characters as they are typed */
        .char {
            color: #94a3b8; /* Default light gray for untyped */
            transition: color 0.1s ease, background-color 0.1s ease;
            position: relative;
        }

        .char.correct {
            color: #0f172a; /* Dark text for correct */
        }

        .char.incorrect {
            color: #ef4444; /* Red for incorrect */
            background-color: #fee2e2;
            border-radius: 2px;
        }

        /* The blinking cursor */
        .char.current-char {
            color: #0f172a;
        }
        
        .char.current-char::before {
            content: "";
            position: absolute;
            left: 0;
            top: 10%;
            bottom: 10%;
            width: 2px;
            background-color: #ef4444; /* Red cursor to match logo accent */
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Hidden input field to capture keystrokes, even on mobile */
        #hidden-input {
            position: absolute;
            opacity: 0;
            top: 0;
            left: 0;
            z-index: -1;
            pointer-events: none;
        }

        /* Branding colors based on the logo */
        .bg-livex-red {
            background-color: #b91c1c; /* Approximate red from logo */
        }
        .text-livex-red {
            color: #b91c1c;
        }
        
        .bg-livex-navy {
            background-color: #0f172a; /* Dark navy blue */
        }
        
        .text-livex-navy {
            color: #0f172a;
        }
        
        /* Blur effect for when test is unfocused */
        .blur-filter {
            filter: blur(4px);
            transition: filter 0.2s ease;
        }
        
        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(255, 255, 255, 0.7);
            z-index: 10;
            border-radius: 0.5rem;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .is-unfocused .overlay {
            opacity: 1;
            pointer-events: auto;
        }

        /* ===================================================================
           Hand-written replacements for the Tailwind utility classes used in
           this file. The Tailwind CDN script can't be loaded in this
           environment, so these reproduce the same classes/values directly.
           =================================================================== */

<script>
    // --- State Variables ---
    const quotes = [
        "The lived experience of an individual is invaluable. We strive to provide solutions that honor and incorporate these diverse perspectives. True understanding comes not just from textbooks, but from the reality of those who have walked the path.",
        "Innovation thrives when diverse voices are heard. We believe that lived experience is the cornerstone of effective and empathetic problem-solving. By listening closely, we build better systems for everyone.",
        "Expertise is often defined by academic achievement, but we recognize that navigating complex systems firsthand builds a unique and powerful expertise of its own. Lived experience experts are essential to our mission.",
        "Empathy is the bridge between knowledge and action. When we center the voices of lived experience experts, we transform theoretical frameworks into practical, meaningful solutions that actually work.",
        "A system designed without the input of those it serves is bound to fail. Our approach ensures that lived experience is not an afterthought, but the foundation upon which we build sustainable solutions."
    ];

    let currentQuote = "";
    let characterElements = [];
    let currentIndex = 0;
    
    let isTestRunning = false;
    let timerInterval = null;
    
    let selectedDuration = 60; // Default to 1 minute (in seconds)
    let timeRemaining = selectedDuration;
    
    let correctChars = 0;
    let incorrectChars = 0;
    let totalKeystrokes = 0;

    // --- DOM Elements ---
    const quoteDisplay = document.getElementById('quote-display');
    const hiddenInput = document.getElementById('hidden-input');
    const testContainer = document.getElementById('test-container');
    const focusOverlay = document.getElementById('focus-overlay');
    
    const timeDisplay = document.getElementById('time-display');
    const wpmDisplay = document.getElementById('wpm-display');
    const accDisplay = document.getElementById('acc-display');
    
    const timeButtons = document.querySelectorAll('.time-btn');
    const restartBtn = document.getElementById('restart-btn');
    
    const resultsModal = document.getElementById('results-modal');
    const resultsContent = document.getElementById('results-content');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const finalWpm = document.getElementById('final-wpm');
    const finalAcc = document.getElementById('final-acc');
    const finalTimeText = document.getElementById('final-time-text');
    const finalCorrectChars = document.getElementById('final-correct-chars');
    const finalIncorrectChars = document.getElementById('final-incorrect-chars');

    // --- Initialization Functions ---
    function getRandomQuote() {
        // Simple word generator for longer tests to ensure we don't run out of text easily
        let longText = "";
        for(let i=0; i<10; i++) {
             const randomIdx = Math.floor(Math.random() * quotes.length);
             longText += quotes[randomIdx] + " ";
        }
        return longText.trim();
    }

    function initTest() {
        // Reset state
        isTestRunning = false;
        clearInterval(timerInterval);
        currentIndex = 0;
        correctChars = 0;
        incorrectChars = 0;
        totalKeystrokes = 0;
        timeRemaining = selectedDuration;

        // Update UI
        updateTimeDisplay();
        wpmDisplay.innerText = "0";
        accDisplay.innerText = "100%";
        hiddenInput.value = "";
        
        // Generate and render new text
        currentQuote = getRandomQuote();
        renderQuote(currentQuote);
        
        // Ensure container is focused and ready
        testContainer.focus();
        updateFocusState();
    }

    function renderQuote(text) {
        quoteDisplay.innerHTML = '';
        characterElements = [];

        // Split text into individual characters and wrap in spans
        text.split('').forEach((char, index) => {
            const charSpan = document.createElement('span');
            charSpan.innerText = char;
            charSpan.classList.add('char');
            // Initial cursor position
            if (index === 0) charSpan.classList.add('current-char');
            
            quoteDisplay.appendChild(charSpan);
            characterElements.push(charSpan);
        });
        
        // Scroll to top
        quoteDisplay.scrollTop = 0;
    }

    // --- Logic & Event Handlers ---
    function handleTyping(e) {
        if (!isFocused()) return;
        
        // Ignore modifier keys that don't produce characters
        if (["Shift", "Meta", "Control", "Alt", "Tab", "Enter", "Escape"].includes(e.key)) return;

        // Start test on first keypress
        if (!isTestRunning && e.key !== "Backspace") {
            startTest();
        }

        const currentCharElement = characterElements[currentIndex];
        const expectedChar = currentQuote[currentIndex];

        if (e.key === 'Backspace') {
            handleBackspace();
            return;
        }

        // Ignore input if we've reached the end
        if (currentIndex >= currentQuote.length) return;

        totalKeystrokes++;

        // Determine if the input matches
        // Explicitly handle spacebar as it might come in as " " or "Spacebar" depending on older browsers, though " " is standard.
        const inputKey = e.key;

        if (inputKey === expectedChar) {
            currentCharElement.classList.add('correct');
            currentCharElement.classList.remove('incorrect', 'current-char');
            correctChars++;
        } else {
            // Visual feedback for space errors
            if (expectedChar === ' ') {
                 currentCharElement.style.backgroundColor = '#fee2e2'; // Light red bg
            }
            currentCharElement.classList.add('incorrect');
            currentCharElement.classList.remove('current-char');
            incorrectChars++;
        }

        // Move to next character
        currentIndex++;
        
        // Update new cursor position
        if (currentIndex < currentQuote.length) {
            characterElements[currentIndex].classList.add('current-char');
            
            // Auto-scroll logic
            autoScroll();
        }

        updateStats();
    }

    function handleBackspace() {
        if (currentIndex > 0) {
            // Remove cursor from current
            if (currentIndex < currentQuote.length) {
                characterElements[currentIndex].classList.remove('current-char');
            }
            
            currentIndex--;
            const prevCharElement = characterElements[currentIndex];
            
            // Revert stats
            if (prevCharElement.classList.contains('correct')) {
                correctChars--;
            } else if (prevCharElement.classList.contains('incorrect')) {
                incorrectChars--;
            }
            totalKeystrokes--;

            // Reset visual state of the previous character
            prevCharElement.classList.remove('correct', 'incorrect');
            prevCharElement.style.backgroundColor = ''; // Reset space bg if any
            prevCharElement.classList.add('current-char'); // Move cursor back
            
            autoScroll();
        }
    }

    function autoScroll() {
         const currentEl = characterElements[currentIndex];
         if (!currentEl) return;
         
         // If cursor moves too far down, scroll the container
         const containerRect = quoteDisplay.getBoundingClientRect();
         const charRect = currentEl.getBoundingClientRect();
         
         if (charRect.bottom > containerRect.bottom - 20) {
             quoteDisplay.scrollTop += 30; // Scroll down a line roughly
         } else if (charRect.top < containerRect.top + 20) {
             quoteDisplay.scrollTop -= 30;
         }
    }

    function startTest() {
        isTestRunning = true;
        timerInterval = setInterval(() => {
            timeRemaining--;
            updateTimeDisplay();
            updateStats(); // Update WPM dynamically

            if (timeRemaining <= 0) {
                endTest();
            }
        }, 1000);
    }

    function updateTimeDisplay() {
        const minutes = Math.floor(timeRemaining / 60);
        const seconds = timeRemaining % 60;
        timeDisplay.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function updateStats() {
        // Calculate Accuracy
        let accuracy = 100;
        if (totalKeystrokes > 0) {
            accuracy = Math.round((correctChars / totalKeystrokes) * 100);
        }
        accDisplay.innerText = `${accuracy}%`;

        // Calculate WPM (Words Per Minute)
        // Standard definition: 1 word = 5 characters
        const timeElapsedSec = selectedDuration - timeRemaining;
        let wpm = 0;
        if (timeElapsedSec > 0) {
            // Calculate gross WPM then subtract errors
            const grossWpm = (totalKeystrokes / 5) / (timeElapsedSec / 60);
            const netWpm = Math.max(0, grossWpm - (incorrectChars / (timeElapsedSec / 60)));
            wpm = Math.round(netWpm);
        }
        wpmDisplay.innerText = wpm;
        
        return { wpm, accuracy };
    }

    function endTest() {
        clearInterval(timerInterval);
        isTestRunning = false;
        
        // Remove focus
        hiddenInput.blur();
        
        // Calculate final stats
        const finalStats = updateStats();
        
        // Populate modal
        finalWpm.innerText = finalStats.wpm;
        finalAcc.innerText = `${finalStats.accuracy}%`;
        finalCorrectChars.innerText = correctChars;
        finalIncorrectChars.innerText = incorrectChars;
        
        const mins = selectedDuration / 60;
        finalTimeText.innerText = `${mins} Minute${mins > 1 ? 's' : ''} Test`;

        // Show Modal with animation
        resultsModal.classList.remove('hidden');
        // Small delay to allow display:block to apply before animating opacity
        setTimeout(() => {
            resultsModal.classList.remove('opacity-0');
            resultsContent.classList.remove('scale-95');
        }, 10);
    }

    // --- Focus Management ---
    function updateFocusState() {
        if (document.activeElement === testContainer || document.activeElement === hiddenInput) {
            testContainer.classList.remove('is-unfocused');
            quoteDisplay.classList.remove('blur-filter');
            hiddenInput.focus(); // Keep mobile input focused
        } else {
            testContainer.classList.add('is-unfocused');
            quoteDisplay.classList.add('blur-filter');
            if(isTestRunning) {
                // Pause timer visually (actual pause logic could be added, but usually tests keep running)
                // For simplicity, we just blur it.
            }
        }
    }
    
    function isFocused() {
        return !testContainer.classList.contains('is-unfocused');
    }

    // --- Event Listeners ---
    
    // Keyboard Input (Desktop)
    document.addEventListener('keydown', (e) => {
        const usingHiddenInput = document.activeElement === hiddenInput;

        // When the hidden input has focus, let it handle its own native text
        // insertion (this is what fires the 'input' listener below, including
        // for the space bar). Only intercept/preventDefault when we're NOT
        // routing through the hidden input, to stop things like page-scroll on space.
        if (!usingHiddenInput && isFocused() && (e.key === " " || e.key === "Backspace")) {
            e.preventDefault();
        }

        if (!usingHiddenInput && isFocused()) {
            handleTyping(e);
        }
    });

    // Mobile Input via hidden field
    hiddenInput.addEventListener('input', (e) => {
         // The hidden input receives the whole string, we just want the last char
         // Need to handle spaces correctly from input events
         const val = hiddenInput.value;
         
         // If length increased, a character was typed
         if (val.length > 0) {
             const lastChar = val[val.length - 1];
             const mockEvent = { key: lastChar, preventDefault: ()=>{} };
             handleTyping(mockEvent);
             
             // Keep input clean but don't lose focus
             hiddenInput.value = ""; 
         }
    });
    
    // Handle mobile backspace (input event doesn't fire on empty backspace easily)
    hiddenInput.addEventListener('keydown', (e) => {
         if (e.key === 'Backspace') {
             handleTyping(e);
         }
    });

    // Focus handling
    testContainer.addEventListener('click', () => {
        hiddenInput.focus();
        updateFocusState();
    });
    
    focusOverlay.addEventListener('click', (e) => {
        e.stopPropagation(); // Prevent double triggering
        hiddenInput.focus();
        updateFocusState();
    });

    document.addEventListener('click', (e) => {
        if (!testContainer.contains(e.target) && e.target !== restartBtn) {
            // Clicked outside
            hiddenInput.blur();
            updateFocusState();
        }
    });

    // Time Selection
    timeButtons.forEach(btn => {
        btn.addEventListener('click', (e) => {
            // Update styling
            timeButtons.forEach(b => {
                b.classList.remove('bg-livex-red', 'text-white');
                b.classList.add('text-slate-600', 'hover:bg-slate-100');
            });
            e.target.classList.remove('text-slate-600', 'hover:bg-slate-100');
            e.target.classList.add('bg-livex-red', 'text-white');

            // Update duration and restart
            selectedDuration = parseInt(e.target.getAttribute('data-time'));
            initTest();
        });
    });

    // Restart Button
    restartBtn.addEventListener('click', initTest);

    // Close Modal
    closeModalBtn.addEventListener('click', () => {
        resultsModal.classList.add('opacity-0');
        resultsContent.classList.add('scale-95');
        setTimeout(() => {
            resultsModal.classList.add('hidden');
            initTest();
        }, 300); // Wait for transition
    });

    // Initialize on load
    window.onload = () => {
        initTest();
        // Force focus initially
        hiddenInput.focus();
        updateFocusState();
    };

</script>
</body>
</html>
